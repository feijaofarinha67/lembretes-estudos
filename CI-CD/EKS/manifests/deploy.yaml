apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      # imagePullSecrets:
      #   - name: ecr-secret
      containers:
      - name: app1
        image: public.ecr.aws/docker/library/httpd:trixie 
        ports:
        - containerPort: 80
